<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeV &mdash; Real-Time Collaborative Code Editor</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('codev-theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      :root.dark {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #ffffff;
        color: #0f172a;
      }
      html.dark, html.dark body {
        background-color: oklch(0.1763 0.014 258.36);
        color: #f8fafc;
      }
      #initial-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: inherit;
        color: inherit;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        animation: initial-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .initial-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.06);
        border: 1px solid rgba(15, 23, 42, 0.12);
        color: #0f172a;
      }
      html.dark .initial-icon {
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.25);
        color: #38bdf8;
      }
      .initial-text {
        font-size: 20px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace, monospace;
        letter-spacing: -0.025em;
      }
      .initial-accent {
        color: #0f172a;
      }
      html.dark .initial-accent {
        color: #38bdf8;
      }
      @keyframes initial-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="initial-brand">
          <div class="initial-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 16 4-4-4-4"></path>
              <path d="m6 8-4 4 4 4"></path>
              <path d="m14.5 4-5 16"></path>
            </svg>
          </div>
          <span class="initial-text">Code<span class="initial-accent">V</span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
