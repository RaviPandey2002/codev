version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: codev
      POSTGRES_DB: codev
    ports:
      - "5432:5432"
    volumes:
      - codev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d codev"]
      interval: 5s

      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - codev_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codev_pgdata:
  codev_redisdata: